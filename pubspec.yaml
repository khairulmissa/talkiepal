name: talkiepal
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  firebase_core: ^4.9.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0
  cloud_firestore: ^6.10.0
  http: ^1.6.0
  image_picker: ^1.2.4
  firebase_storage: ^13.6.0
  flame: ^1.38.2
  record: ^6.2.1
  flutter_tts: ^4.2.5
  # 7.5 needs Flutter 3.44; 7.4 works on older Flutter too.
  speech_to_text: ">=7.4.0 <7.5.0"
  supabase_flutter: ^2.18.3
  agora_rtc_engine: ^6.6.4
  permission_handler: 11.4.0
  pdf: ^3.12.0
  printing: ^5.14.3
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/
    - lib/assets/images/alphabets/
    - lib/assets/images/numbers/
    - lib/assets/images/colors/
    - lib/assets/images/shapes/
    - lib/assets/images/animals/
    - lib/assets/images/fruits/
    - lib/assets/images/bodyparts/
    - lib/assets/images/clothes/
    - lib/assets/images/vehicles/
    - lib/assets/images/morning_routine/
    - lib/assets/images/feelings/
    - lib/assets/images/things_i_like/
    #- lib/assets/images/kid_profile/
    #- lib/assets/images/kids/
    #- lib/assets/images/kids/
    #- lib/assets/images/logo/
    #- lib/assets/images/outlook/
    #- lib/assets/images/parent/
    #- lib/assets/images/robot/
    #- lib/assets/images/google/